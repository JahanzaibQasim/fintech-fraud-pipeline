version: 2

sources:
  - name: bronze_layer  # <-- MUST match 1st argument in source('bronze_layer', ...)
    project: ecstatic-armor-506312-m7
    dataset: fintech_raw_bronze
    tables:
      - name: bronze_transactions
      
models:
  - name: silver_transactions
    description: "Cleaned and deduplicated streaming transactions layer."
    columns:
      - name: transaction_id
        description: "Primary key"
        tests:
          - unique
          - not_null

      - name: user_id
        tests:
          - not_null

      - name: amount
        tests:
          - not_null

  - name: gold_user_daily_risk_metrics
    description: "Daily aggregated risk and spend metrics per user."
    columns:
      - name: user_id
        tests:
          - not_null

      - name: transaction_date
        tests:
          - not_null

      - name: total_transactions
        tests:
          - not_null